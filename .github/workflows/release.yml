name: Release bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v0.2.2-alpha.1
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux-x64
          - platform: windows-latest
            bundles: nsis,msi
            artifact: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Hyper Get ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: true
      - name: Generate bundle checksums
        shell: bash
        run: |
          find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' \) -print0 | sort -z | xargs -0 sha256sum > target/release/bundle/SHA256SUMS-${{ matrix.artifact }}.txt
        if: runner.os == 'Linux'
      - name: Generate Windows bundle checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content target/release/bundle/SHA256SUMS-${{ matrix.artifact }}.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: true
          files: target/release/bundle/SHA256SUMS-${{ matrix.artifact }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-get-${{ matrix.artifact }}-${{ env.RELEASE_TAG }}
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/SHA256SUMS-${{ matrix.artifact }}.txt
          if-no-files-found: error

  extensions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm browser:build && pnpm browser:package
      - name: Generate extension checksums
        run: cd extensions/browser/packages && sha256sum *.zip > SHA256SUMS-extensions.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: true
          files: |
            extensions/browser/packages/hyper-get-chromium.zip
            extensions/browser/packages/hyper-get-firefox.zip
            extensions/browser/packages/SHA256SUMS-extensions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-get-browser-extensions-${{ env.RELEASE_TAG }}
          path: extensions/browser/packages/*
          if-no-files-found: error
