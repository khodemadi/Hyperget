name: Release installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: {version: 10.14.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Hyper Get ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content target/release/bundle/SHA256SUMS-windows.txt
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hyper-get-windows-${{ github.ref_name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS-windows.txt
          if-no-files-found: error
